name: Build CyberScribe Executable

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build with PyInstaller
      run: |
        $VAD_PATH = python -c "import faster_whisper, os; print(os.path.join(os.path.dirname(faster_whisper.__file__), 'assets', 'silero_vad_v6.onnx'))"
        pyinstaller --noconsole --onefile --noconfirm --hidden-import=updater --hidden-import=models_storage --hidden-import=pyaudio --hidden-import=pynput.keyboard._win32 --hidden-import=pynput.mouse._win32 --add-data "${VAD_PATH};faster_whisper/assets" --icon "app.ico" --name "CyberScribe" CyberScribe.py

    - name: Read application version
      id: appver
      shell: pwsh
      run: |
        $m = Select-String -Path CyberScribe.py -Pattern '__version__ = "(.+)"'
        $version = $m.Matches.Groups[1].Value
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build installer
      run: |
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.appver.outputs.version }} installer\CyberScribe.iss

    - name: Write SHA256 sidecar
      run: |
        $hash = (Get-FileHash -Path dist/CyberScribe.exe -Algorithm SHA256).Hash.ToLower()
        Set-Content -Path dist/CyberScribe.exe.sha256 -Value $hash -NoNewline

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/CyberScribe.exe
          dist/CyberScribe.exe.sha256
          dist/CyberScribe-Setup-*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
